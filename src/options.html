<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="settingsTitle"></title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <div class="title">
          <img class="settings-icon" src="../assets/icon1024.png" alt="" width="44" height="44">
          <h1 data-i18n="settingsTitle"></h1>
        </div>
        <button id="reset" type="button" data-i18n="reset"></button>
      </header>

      <section>
        <h2 data-i18n="controls"></h2>
        <label class="color-row">
          <span data-i18n="trackbarColor"></span>
          <input id="accentColor" type="color">
        </label>
        <div id="controls" class="grid"></div>
      </section>

      <section>
        <h2 data-i18n="window"></h2>
        <label><input id="clickVideoToTogglePlayback" type="checkbox"> <span data-i18n="clickVideoPlayback"></span></label>
        <label><input id="rememberWindowSize" type="checkbox"> <span data-i18n="rememberWindowSize"></span></label>
        <label><input id="elementPickerEnabled" type="checkbox"> <span data-i18n="enableElementPicker"></span></label>
      </section>

      <section>
        <h2 data-i18n="speed"></h2>
        <label class="field">
          <span data-i18n="speedSteps"></span>
          <input id="speedSteps" type="text" inputmode="decimal" spellcheck="false">
        </label>
      </section>

      <section>
        <h2 data-i18n="shortcuts"></h2>
        <div id="shortcuts" class="grid"></div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
